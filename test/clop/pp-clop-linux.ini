concurrency=20
rapid=true

[each]
tc=2+0.01

[logging]
path=test/clop/log
engine=true

[openings]
file=test/opening/book8ply.raw
order=random

[draw]
test=false

[resign]
movecount=5
test=false

[engine]
name=Qapla opt
cmd=/home/mangar/dev/qapla/build/ReleaseOpt/Qapla
proto=uci
trace=command

[clop]
activepairs=16
gamespersample=4
samples=40000
warmupsamples=24
h=3.0
outcomeinterval=25
option name ppThreatRankMultiplier type spin default 20 min 0 max 100
option name ppThreatAttackMultiplier type spin default 5 min 0 max 100
option name ppThreatSupportMultiplier type spin default 30 min 0 max 100
option name ppThreatNotBlockedMultiplier type spin default 20 min 0 max 100
option name ppThreatAdvanceMultiplier type spin default 5 min 0 max 100

[clopvalue]
name=ppThreatAttackMultiplier
; default=5
min=0
max=10

[clopvalue]
name=ppThreatSupportMultiplier
; default=30
min=20
max=40

[clopvalue]
name=ppThreatNotBlockedMultiplier
; default=20
min=10
max=30

[clopvalue]
name=ppThreatAdvanceMultiplier
; default=5
min=0
max=10





