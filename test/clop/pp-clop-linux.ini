concurrency=20
rapid=true

[each]
tc=2+0.01

[logging]
path=test/clop/log
engine=false

[openings]
file=test/opening/book8ply.raw
order=random

[draw]
test=false

[resign]
movecount=5
test=false

[engine]
name=Qapla opt
cmd=/home/mangar/dev/qapla/build/ReleaseOpt/Qapla
proto=uci

[clop]
activepairs=16
gamespersample=4
samples=40000
warmupsamples=24
h=3.0
outcomeinterval=25

pawnPassedFactorMg type spin default 10 min 0 max 100
pawnPassedFactorEg type spin default 10 min 0 max 100
pawnPassedRank7Mg type spin default 80 min 0 max 1000
pawnPassedRank7Eg type spin default 80 min 0 max 1000
pawnProtectedPassedFactorMg type spin default 10 min 0 max 100
