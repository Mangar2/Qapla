# Standard-Settingsfile für CLOP-Läufe (Arbeitsliste test/arbeitsliste.md)
# Aufruf (aus dem Repo-Root):
#   ~/bin/qet --settingsfile=test/clop/clop-standard.ini \
#       --engine name=Qapla cmd=<pfad zum ReleaseOpt-Binary> \
#       --clop samples=<N> \
#       --clopvalue name=<UciOption> min=<min> max=<max> [--clopvalue ...]
# Die Engine wird bewusst nicht hier definiert, sondern per Parameter uebergeben,
# damit die Datei plattformunabhaengig bleibt.
#
# samples-Richtwert: 1 Parameter ~1000, 2 Parameter ~2000-3000, >=3 Parameter ~5000
# Voraussetzung: ReleaseOpt-Build (make ReleaseOpt) - nur dort sind die
# Tuning-Parameter als UCI-Optionen sichtbar (PARAM_OPTIMIZE).
# UCI-Optionsnamen vorab pruefen: echo uci | build/ReleaseOpt/Qapla

concurrency=30
rapid=true

[each]
tc=10+0.01
proto=uci

[logging]
path=test/log
engine=false

[openings]
file=test/opening/book8ply.raw
order=random

[draw]
active=true
movenumber=60
movecount=20
score=20
test=false

[resign]
active=true
movecount=5
score=500
twosided=false
test=false

[clop]
activepairs=8
gamespersample=4
samples=5000
warmupsamples=300
outcomeinterval=25
