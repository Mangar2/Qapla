# EPD run: wmtest.epd at fixed depth, 10 parallel tasks.
# The engine itself is passed on the command line, e.g. (run from the repository root):
#   c:\development\bin\qet.exe --settingsfile=test/epd/epd-wmtest-depth.ini --engine name="Qapla current" cmd=c:/development/qapla2/build/Release/Qapla.exe
# The protocol is set here via [each], so it does not need to be given on the CLI.

concurrency=10
rapid=false

[each]
proto=uci

[epd]
file=test/epd/wmtest.epd
depth=18

[logging]
engine=false
path=test/epd/log
