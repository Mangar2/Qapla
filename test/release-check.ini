# Release check: qapla-engine-tester compliance suite against the binary that ships.
# The engine is passed on the command line, run from the repository root:
#   ~/bin/qapla-engine-tester --settingsfile=test/release-check.ini --engine name=Qapla cmd=<absolute path to the binary>
# Every module is on: underrun and timeusage are off by default, nomemory and
# nolowercase are skipped by default - all four are set here on purpose.

concurrency=10
rapid=false

[each]
proto=uci

[logging]
path=test/log
engine=false

[test]
numgames=50
underrun=true
timeusage=true
nomemory=false
nolowercase=false
noponder=false
noepd=false
nooption=false
nostop=false
nowait=false
noanalyze=false
nogolimits=false
nofens=false
nocompute=false
nostartstop=false
