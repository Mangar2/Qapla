# The counterpart of strength-blend95, and the reason it exists: the mac measured 131 Elo between
# nowdl and hce, the linux run measured 66 between blend95 and hce, and those two figures cannot be
# compared. Different machines, different builds - the mac nnue ran on neon, the linux one now on
# avx2 - and an elo out of a three engine round robin is not anchored like one out of a head to head.
#
# So nowdl plays the same thousand games here: same machine, same build, same opponent, same time
# control, same concurrency, and one run after the other rather than side by side, so that neither is
# playing on a machine the other one is loading. Then the two numbers mean the same thing.
#
#   ~/bin/qet --settingsfile=test/tournament/strength-set1-nowdl.ini \
#     --engine name=Qapla-HCE cmd=<repo>/new-versions/Qapla-blendtest-hce \
#     --engine name=nnue-set1-nowdl cmd=<repo>/new-versions/Qapla-blendtest-nnue \
#       option.NnueFile=<repo>/test/nnue/nets-set1-nowdl-epoch08.nnue
#
# Concurrency 14 for the linux machine: 16 physical cores behind 32 threads, and two cores stay free
# for qet itself. Both binaries are built there with NATIVE=1, so the nnue runs on avx2 rather than
# on its 128 bit path - without that the net loses 22 % of its speed and the tournament measures the
# build instead of the net.
concurrency=14

[each]
tc=10+0.05
proto=uci
option.Hash=64

[logging]
path=test/log
engine=false

[openings]
file=test/opening/book8ply.raw
order=random

[draw]
movenumber=60
movecount=20
score=20
test=false

[resign]
movecount=5
score=500
twosided=false
test=false

[pgnoutput]
file=test/log/strength-set1-nowdl.pgn
append=true
min=true
clock=true
eval=false
depth=false
pv=false

[tournament]
type=round-robin
games=100
rounds=10
repeat=2
ratinginterval=50
file=test/log/strength-set1-nowdl.state
