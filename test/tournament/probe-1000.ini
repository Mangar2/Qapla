# A thousand games of one net against the hand written evaluation, and nothing else.
#
# Which epoch: the best one the run has reached so far, as its own log calls it, and never before
# epoch 2 - a single epoch says nothing. The best so far is a lower bound on what the run will deliver,
# so a probe that already fails the test fails it for the whole run, while a probe of epoch 2 alone
# would condemn a run for a net it had already improved on.
#
# This is how an epoch that is not the final one is measured. It never goes into the big gauntlet:
# that tournament is for finished nets, 50 rounds of 100 games each, and an engine that joins it for a
# quick look would add five thousand games to every round it is missing. A probe belongs beside it -
# and only when the gauntlet is not running, because both want the same fourteen pairs.
#
# The two file names are not in here, so one settings file serves every probe. They come with the call:
#
#   ~/bin/qet --settingsfile=test/tournament/probe-1000.ini \
#     --tournament file=test/log/probe-<what>.state \
#     --pgnoutput file=test/log/probe-<what>.pgn \
#     --engine name=Qapla-HCE cmd=<repo>/new-versions/Qapla-blendtest-hce \
#     --engine name=<what> cmd=<repo>/new-versions/Qapla-blendtest-nnue \
#       option.NnueFile=<the net>
#
# Everything else is what the gauntlet uses, so the score against hce may be read beside it. The elo
# figures of two tournaments cannot be compared - each is anchored in its own field - but the score
# against the same opponent on the same machine can.
concurrency=14

[each]
tc=10+0.05
proto=uci
option.Hash=64

[logging]
path=test/log
engine=false

[openings]
file=test/opening/book8ply.raw
order=random

[draw]
movenumber=60
movecount=20
score=20
test=false

[resign]
movecount=5
score=500
twosided=false
test=false

[pgnoutput]
append=true
min=true
clock=true
eval=false
depth=false
pv=false

[tournament]
type=round-robin
games=100
rounds=10
repeat=2
ratinginterval=50
