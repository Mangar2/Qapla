# Does a less selective search play better at the same depth? The depth the nnue data is labelled
# with is fixed at 8; a search that prunes less at that depth spends more nodes on the same depth, and
# the question is whether its values - and its moves - are better for it.
#
# Both engines are the same binary of the hand written evaluation, built with the futility and lmr
# groups exposed (see search/search-config.h). One plays the defaults, the other with both futility
# prunings off and the lmr divisor raised: about 2.9 times the nodes of wmtest at depth 8.
#
#     ~/bin/qet --settingsfile=test/tournament/depth8-selectivity.ini \
#       --tournament file=test/log/depth8-selectivity.state --pgnoutput file=test/log/depth8-selectivity.pgn \
#       --engine name=default cmd=<repo>/new-versions/<binary> \
#       --engine name=factor3 cmd=<repo>/new-versions/<binary> \
#         option.ffDepthFactor=5000 option.futDepthFactor=5000 option.lmrDivisor=476
#
# The same opening book and adjudication as test/tournament/epochs.ini, a fixed depth in place of the
# clock. At a fixed depth the search is deterministic, so a game is decided by its opening and the
# colours; the colour swap plays every opening both ways.
concurrency=9

[each]
tc=depth:8
proto=uci
option.Hash=64

[logging]
path=test/log
engine=false

[openings]
file=test/opening/book8ply.raw
order=random

[draw]
movenumber=60
movecount=20
score=20
test=false

[resign]
movecount=5
score=500
twosided=false
test=false

[pgnoutput]
append=true
min=true
clock=false
eval=false
depth=false
pv=false

[tournament]
type=round-robin
games=3000
rounds=1
repeat=2
ratinginterval=100
