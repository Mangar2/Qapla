# The labelling pass: every position of every game of a playing template is searched to depth 8
# by the hand crafted eval, and the values are written into a new pgn. That pgn is what
# src/trainer/convert.py reads, which is why it needs long notation - the converter decodes those
# moves without a move generator - and why min=false: convert.py takes the game result from the
# Result tag, and a minimal pgn writes none.
#
#   ~/bin/qet --settingsfile=test/tournament/label-hce-depth8.ini \
#     --analysis pgn=<the template> \
#     --engine name=HCE cmd=<repo>/new-versions/Qapla-0.5.0-027-20-hce
concurrency=9

[each]
tc=depth:8
proto=uci

[logging]
path=test/log
engine=false

[analysis]
pgn=test/nnue/games-hce-depth6.pgn
direction=reverse

[pgnoutput]
file=test/nnue/games-hce-depth6-labelled.pgn
append=true
min=false
clock=false
eval=true
depth=false
pv=false
notation=lan
