# The gauntlet that measures the three nets of set 1 against the hand written evaluation: wdl, nowdl
# and the five percent blend, each against hce, none against another. Hce is the gauntlet engine, so
# every game has it on one side - that is what makes the three figures comparable, they are all read
# against the same opponent in the same run.
#
# 100 games a round and 50 rounds, so 5000 games a pairing and 15000 in all. The rounds are what makes
# it readable while it runs: every round adds a hundred games to each of the three pairings, so the
# table is complete from the first round onwards and only gets tighter.
#
# On the linux machine, because the mac is training. Same settings as the two runs of a thousand games
# that came before it, so that those can be read alongside: same time control, same book, same hash,
# same adjudication, concurrency 14.
#
#   ~/bin/qet --settingsfile=test/tournament/strength-gauntlet.ini \
#     --engine name=Qapla-HCE cmd=<repo>/new-versions/Qapla-blendtest-hce gauntlet=true \
#     --engine name=nnue-set1-wdl     cmd=<repo>/new-versions/Qapla-blendtest-nnue \
#       option.NnueFile=<repo>/test/nnue/nets-set1-wdl-epoch08.nnue \
#     --engine name=nnue-set1-nowdl   cmd=<repo>/new-versions/Qapla-blendtest-nnue \
#       option.NnueFile=<repo>/test/nnue/nets-set1-nowdl-epoch08.nnue \
#     --engine name=nnue-set1-blend95 cmd=<repo>/new-versions/Qapla-blendtest-nnue \
#       option.NnueFile=<repo>/test/nnue/nets-set1-blend95-epoch08.nnue
#
# Stop it whenever and continue with the same call; the tournament file holds the state.
concurrency=14

[each]
tc=10+0.05
proto=uci
option.Hash=64

[logging]
path=test/log
engine=false

[openings]
file=test/opening/book8ply.raw
order=random

[draw]
movenumber=60
movecount=20
score=20
test=false

[resign]
movecount=5
score=500
twosided=false
test=false

[pgnoutput]
file=test/log/strength-gauntlet.pgn
append=true
min=true
clock=true
eval=false
depth=false
pv=false

[tournament]
type=gauntlet
games=100
rounds=50
repeat=2
ratinginterval=50
file=test/log/strength-gauntlet.state
