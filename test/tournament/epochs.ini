# One tournament for the epochs of a single training: every epoch plays the same hand written
# evaluation, so the elo figures of the epochs may be compared with each other - they are anchored in
# one field, in one run, on one machine.
#
# What it is for: we measure a net during training by the loss on games it does not train on, and we
# do not know how well that follows playing strength. Two runs with the identical loss after two
# epochs ended 186 elo apart. A figure per epoch against one opponent turns that into a curve, and
# afterwards the loss can be checked against it.
#
# 1500 games a pairing in a single round, because a round is the unit qet finishes before it starts
# another: each epoch gets its full fifteen hundred, one after the other, in the order the epochs
# arrive. The number has to fit the training, and measured rather than guessed: fourteen pairs play 32
# games a minute, so 2000 took 62 minutes while an epoch of a four set corpus trains in 57 - the
# playing fell behind by five minutes an epoch and the queue of waiting epochs grew. 1500 takes 47
# minutes and keeps step, at a cost of two elo on the error bar, +/- 18 instead of 16.
#
#   first epoch, which writes the settings into the tournament file:
#     ~/bin/qet --settingsfile=test/tournament/epochs.ini \
#       --tournament file=test/log/epochs-<run>.state --pgnoutput file=test/log/epochs-<run>.pgn \
#       --engine name=Qapla-HCE cmd=<repo>/new-versions/Qapla-blendtest-hce gauntlet=true \
#       --engine name=<run>-e01 cmd=<repo>/new-versions/Qapla-blendtest-nnue option.NnueFile=<net>
#
#   every later epoch:
#     python3 src/pipeline/join-gauntlet.py --state test/log/epochs-<run>.state \
#       --nets test/nnue/nets-<run> --net <that epoch's net> --name <run>-eNN
#
# It wants the same fourteen pairs as the big gauntlet, so the two never run at the same time.
concurrency=14

[each]
tc=10+0.05
proto=uci
option.Hash=64

[logging]
path=test/log
engine=false

[openings]
file=test/opening/book8ply.raw
order=random

[draw]
movenumber=60
movecount=20
score=20
test=false

[resign]
movecount=5
score=500
twosided=false
test=false

[pgnoutput]
append=true
min=true
clock=true
eval=false
depth=false
pv=false

[tournament]
type=gauntlet
games=1500
rounds=1
repeat=2
ratinginterval=100
