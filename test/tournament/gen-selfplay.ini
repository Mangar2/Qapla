# Generating training games: one engine against itself at a fixed depth. Both "engines" are the
# same binary, so a game is determined by its opening alone - the book leaf is the only source of
# variety. Hence repeat=1 and noswap=true: with a colour swap every opening would yield the same
# game twice.
#
# The pgn is the playing template and holds no evaluation. It does hold the result, because the
# wdl of every position comes from it - min=false for exactly that reason, see convert.py.
# Moves in long notation, because the converter has no move generator.
concurrency=10
rapid=true

[each]
tc=depth:6
proto=uci

[logging]
path=test/log
engine=false

[openings]
file=test/nnue/start-positions.pgn
order=sequential

[draw]
active=true
movenumber=60
movecount=20
score=20
test=false

[resign]
active=true
movecount=5
score=500
twosided=false
test=false

[pgnoutput]
file=test/log/gen-selfplay.pgn
append=true
min=false
clock=false
eval=false
depth=false
pv=false
notation=lan

[tournament]
type=round-robin
games=1000
rounds=1
repeat=1
noswap=true
ratinginterval=0
file=test/log/gen-selfplay.state
