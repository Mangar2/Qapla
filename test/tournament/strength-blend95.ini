# A tournament of its own, not a round added to strength-round-robin. The question here is only what
# a five percent weight on the result of the game did, against the same opponent and with the same
# settings as the tournament that measured the other two variants of set 1 - but on the linux
# machine, so the two tournaments are not one measurement and their figures do not get mixed.
#
# Rounds of 100 games for the reason given in strength-round-robin: the state grows in steps that
# each say something, and the run can be stopped and continued at any of them.
#
#   ~/bin/qet --settingsfile=test/tournament/strength-blend95.ini \
#     --engine name=Qapla-HCE cmd=<repo>/new-versions/Qapla-blendtest-hce \
#     --engine name=nnue-set1-blend95 cmd=<repo>/new-versions/Qapla-blendtest-nnue \
#       option.NnueFile=<repo>/test/nnue/nets-set1-blend95-epoch08.nnue
#
# Concurrency 14 for the linux machine: 16 physical cores behind 32 threads, and two cores stay free
# for qet itself. Both binaries are built there with NATIVE=1, so the nnue runs on avx2 rather than
# on its 128 bit path - without that the net loses 22 % of its speed and the tournament measures the
# build instead of the net.
concurrency=14

[each]
tc=10+0.05
proto=uci
option.Hash=64

[logging]
path=test/log
engine=false

[openings]
file=test/opening/book8ply.raw
order=random

[draw]
movenumber=60
movecount=20
score=20
test=false

[resign]
movecount=5
score=500
twosided=false
test=false

[pgnoutput]
file=test/log/strength-blend95.pgn
append=true
min=true
clock=true
eval=false
depth=false
pv=false

[tournament]
type=round-robin
games=100
rounds=10
repeat=2
ratinginterval=50
file=test/log/strength-blend95.state
