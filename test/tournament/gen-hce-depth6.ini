# Generating the training games: Qapla with the hand crafted eval against itself at depth 6.
#
# One game per book leaf. Both engines are the same binary and the search is deterministic at a
# fixed depth, so a leaf and a colour decide the game completely - repeat=1 and noswap=true,
# because a colour swap would play every opening a second time and get the same game back.
#
# Draw adjudication stays on: an endless shuffle of KRKR teaches a net nothing. Win and loss
# adjudication is off, so a won game is played to its end - those are the positions a net has
# the least of.
#
# The pgn is the playing template only and carries no evaluation. A later pass analyses it and
# writes the values. Moves in short notation, simply because it is shorter: the tester runs every
# move through its move generator whatever the notation. Long notation is worth something only for
# the pgn the analysis writes, which src/trainer/convert.py reads without a generator.
#
#   ~/bin/qet --settingsfile=test/tournament/gen-hce-depth6.ini \
#     --engine name=HCE-A cmd=<repo>/new-versions/Qapla-0.5.0-027-20-hce \
#     --engine name=HCE-B cmd=<repo>/new-versions/Qapla-0.5.0-027-20-hce
#
# The run may be stopped at any time and continued with the same call: the tournament file holds
# the state and the pgn is appended to.
concurrency=9

[each]
tc=depth:6
proto=uci

[logging]
path=test/log
engine=false

[openings]
file=test/nnue/start-positions-1m.pgn
order=sequential

[draw]
active=true
movenumber=60
movecount=20
score=20
test=false

# No [resign] block on purpose: won games are played to their end. qet ignores
# active=false - the presence of the block switches the adjudication on - so the block
# has to be absent, not disabled.

[pgnoutput]
file=test/nnue/games-hce-depth6.pgn
append=true
min=true
clock=false
eval=false
depth=false
pv=false
notation=san

[tournament]
type=round-robin
games=1000020
rounds=1
repeat=1
noswap=true
ratinginterval=0
file=test/log/gen-hce-depth6.state
