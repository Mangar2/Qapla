# Tournament: Qapla 0.5 with the stockfish net against Qapla 0.5 with the hand crafted eval.
# Both engines are built from the same source; only USE_STOCKFISH_EVAL differs. A tournament,
# not an SPRT, because the question is how large the difference is, not which of two candidate
# values is more likely.
#
#   ~/bin/qet --settingsfile=test/tournament/sf-vs-hce.ini \
#     --engine name=Qapla-sf-net cmd=<repo>/new-versions/Qapla-sf-eval-neon \
#     --engine name=Qapla-hce    cmd=<repo>/new-versions/Qapla-05-hce-nb
concurrency=10
rapid=true

[each]
tc=60+0.5
proto=uci

[logging]
path=test/log
engine=false

[openings]
file=test/opening/book8ply.raw
order=random

[draw]
active=true
movenumber=60
movecount=20
score=20
test=false

[resign]
active=true
movecount=5
score=500
twosided=false
test=false

[pgnoutput]
file=test/log/tournament-sf-vs-hce.pgn
min=true
clock=true
eval=false
depth=false
pv=false

[tournament]
type=round-robin
games=300
rounds=1
repeat=2
ratinginterval=20
file=test/log/tournament-sf-vs-hce.state
