# The tournament that measures how strongly a new version plays. Round robin, so every version
# meets every other one, and extended rather than replaced as versions arrive.
#
# Rounds of 100 games, and that is the point of them. A round builds its own pairings, so a version
# added later plays the rounds it is missing first: with 1000 games planned per pairing and 400
# played, a new engine catches up over rounds 1 to 4 and there is an overview of every version
# early, before anything is played to the end. One round of 1000 games would give a full result for
# the old pairings and nothing at all for the new one until the very end.
#
#   ~/bin/qet --settingsfile=test/tournament/strength-round-robin.ini \
#     --engine name=Qapla-HCE  cmd=<repo>/new-versions/... \
#     --engine name=nnue-set1-wdl   cmd=<...> option.NnueFile=<...> \
#     --engine name=nnue-set1-nowdl cmd=<...> option.NnueFile=<...>
#
# Stop it whenever and continue with the same call; the tournament file holds the state, and adding
# an engine to the call is how the tournament grows.
concurrency=9

[each]
tc=10+0.05
proto=uci
option.Hash=64

[logging]
path=test/log
engine=false

[openings]
file=test/opening/book8ply.raw
order=random

[draw]
movenumber=60
movecount=20
score=20
test=false

[resign]
movecount=5
score=500
twosided=false
test=false

[pgnoutput]
file=test/log/strength-round-robin.pgn
append=true
min=true
clock=true
eval=false
depth=false
pv=false

[tournament]
type=round-robin
games=100
rounds=10
repeat=2
ratinginterval=50
file=test/log/strength-round-robin.state
