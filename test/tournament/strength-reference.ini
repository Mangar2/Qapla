# The tournament that measures every new net from 02.10.2026 on, and it replaces the 5000 game gauntlet
# against hce. Against hce the best nets score 63 to 65 %, and the further a net is from its opponent
# the more games it takes to tell two such nets apart: at 1500 games the bar was already +/-15 elo. A
# reference near the nets that are measured gives the most information per game.
#
# The reference is nnue-set1234, the best net with a single head: 63.18 % against hce over 5000 games,
# 2716.0 +/-8 in the field of that tournament. It is the gauntlet engine, so every net plays it and
# every figure is read against it.
#
# 10000 games a pairing, 100 rounds of 100: trainings take longer now, and tournaments may too.
#
# hce stays in, as the thread back to everything measured before - but it joins only once the first net
# has its 10000 games, so that it does not halve the speed at which a new net is measured.
#
# Nets with layer stacks need an engine built after the stacks came in, new-versions/Qapla-stacks-nnue,
# and every nnue engine here uses that one: a single headed net evaluates with it exactly as before.
#
#   first start:
#     ~/bin/qet --settingsfile=test/tournament/strength-reference.ini \
#       --engine name=nnue-set1234 cmd=<repo>/new-versions/Qapla-stacks-nnue gauntlet=true \
#         option.NnueFile=<repo>/test/nnue/nnue-set1234-best.nnue \
#       --engine name=<net> cmd=<repo>/new-versions/Qapla-stacks-nnue option.NnueFile=<its net>
#   a net that joins later: join-gauntlet.py --state test/log/strength-reference.state --binary Qapla-stacks-nnue
concurrency=14

[each]
tc=10+0.05
proto=uci
option.Hash=64

[logging]
path=test/log
engine=false

[openings]
file=test/opening/book8ply.raw
order=random

[draw]
movenumber=60
movecount=20
score=20
test=false

[resign]
movecount=5
score=500
twosided=false
test=false

[pgnoutput]
file=test/log/strength-reference.pgn
append=true
min=true
clock=true
eval=false
depth=false
pv=false

[tournament]
type=gauntlet
games=100
rounds=100
repeat=2
ratinginterval=100
file=test/log/strength-reference.state
