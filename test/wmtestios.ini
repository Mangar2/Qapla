# EPD run on macOS: wmtest.epd at fixed depth 18, 10 parallel tasks, engine included.
# Run from the repository root:
#   qet --settingsfile=test/epd/wmtestios.ini

concurrency=10
rapid=false

[engine]
name=Qapla-current
cmd=build/Release/Qapla

[each]
proto=uci

[epd]
file=test/epd/wmtest.epd
depth=20

[logging]
engine=false
path=test/epd/log
