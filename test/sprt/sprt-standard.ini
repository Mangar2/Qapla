# Standard-Settingsfile für SPRT-Läufe (Arbeitsliste test/arbeitsliste.md)
# Aufruf (aus dem Repo-Root):
#   ~/bin/qet --settingsfile=test/sprt/sprt-standard.ini --sprt file=test/log/sprt-<SCHRITT-ID>.state
#
# Challenger = frischer Build mit der Aenderung (build/Release/Qapla, gauntlet=true)
# Baseline   = Binary der letzten akzeptierten Version (test/engines/Qapla-baseline)
#              -> nach jedem H1-Accept neu kopieren, siehe Arbeitsliste "Workflow".

concurrency=10
rapid=true

[each]
tc=20+0.01

[logging]
path=test/log
engine=false

[openings]
file=test/opening/book8ply.raw
order=random

[draw]
test=false

[resign]
movecount=5
test=false

[sprt]
eloh0=0
eloh1=3
alpha=0.05
beta=0.05
maxgames=10000
file=test/log/sprt-current.state

[engine]
name=Qapla-baseline
cmd=test/engines/Qapla-baseline
proto=uci

[engine]
name=Qapla-challenger
cmd=build/Release/Qapla
proto=uci
gauntlet=true
