# SPRT on opposite coloured bishop endgames, for todo item 10.
#
# The start positions come from tools/gen-ocb-endgames.py: one bishop per side on squares
# of opposite colour, pawns on both sides and a surplus of one or two pawns for one of them.
# The standard book reaches that material far too rarely to measure a scaling factor on it.
#
# Differences to sprt-standard.ini, both of them consequences of starting in an endgame:
# - order=sequential, so every position is actually played instead of sampled at random
# - draw adjudication may start at move 30 rather than 60; these games have no opening phase
#   in front of them and would otherwise be shuffled out to the fifty move rule
#
# Run from the repository root:
#   qet --settingsfile=test/sprt/sprt-ocb.ini --engine name=<base> cmd=<base.exe> \
#       --engine name=<new> cmd=<new.exe> gauntlet=true --sprt file=test/log/sprt-ocb.state

concurrency=30
rapid=true

[each]
tc=5+0.01
proto=uci

[logging]
path=test/log
engine=false

[openings]
file=test/opening/ocb-endgames.raw
order=sequential

[draw]
active=true
movenumber=30
movecount=20
score=20
test=false

[resign]
active=true
movecount=5
score=500
twosided=false
test=false

[sprt]
eloh0=-2
eloh1=3
alpha=0.05
beta=0.05
maxgames=20000
file=test/log/sprt-ocb.state
