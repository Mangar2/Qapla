# The steps that turn book leaves into trained nets, in the order they run.
#
# Read by src/pipeline/pipeline.py. Every value is here; the logic of the five step kinds is in the
# script, because chunking, resuming and the shape of a qet settings file are logic and not
# settings. What changes between runs - which engines, which nets, which depth, which host, which
# files - is here.
#
# The whole flow per data set:
#
#   1 play     engine against engine from the book, a template pgn without evaluations
#   2 label    every position of it searched to depth 8, a pgn with the values
#   3 convert  that pgn into the packed .gam of the set, which is kept on its own
#   4 append   the new .gam onto the cumulated file, index rebuilt over one file
#   5 train    from nothing, validation held back by whole games, then test against a reference
#
# Kinds 1 and 2 are implemented. A step of a kind that is not implemented stops the run with a
# note rather than being skipped silently.
#
# Nine games come from every book leaf: three engines against themselves, one game each because
# the search is deterministic at a fixed depth, and three pairings of two different engines, two
# games each through the colour swap.

[meta]
book = "the 1,000,020 leaves of test/nnue/start-positions-1m.pgn, see src/nnue-data/generated-data.md"

# --------------------------------------------------------------------------- hosts
# concurrency is physical cores minus one: qet drives every engine process, writes the pgn and
# keeps the state file, and at depth 6 the turnover is frequent enough that it needs a core.
# A host has to meet the list under "What a machine needs before it can help" in
# src/nnue-data/generated-data.md before a step is given to it.

[hosts.mac]
hostname = "<HOSTNAME>"
repo = "<REPO>"
qet = "~/bin/qet"
concurrency = 9          # 10 cores

[hosts.mac.engines.hce]
binary = "new-versions/Qapla-0.5.0-027-20-hce"

[hosts.qapla]
hostname = "qapla"
ssh = "<SSH-TARGET>"
repo = "/home/mangar/dev/qapla"
qet = "~/bin/qet"
concurrency = 15         # 16 physical cores behind 32 threads

[hosts.qapla.engines.hce]
binary = "new-versions/Qapla-hce-linux"

# Generation 1, the weak net. avx2 because this binary never leaves this machine; it is 22 %
# faster than the x86-64-v2 build and identical to the node.
[hosts.qapla.engines.nnue1]
binary = "new-versions/Qapla-nnue-linux-avx2"
options = { NnueFile = "test/nnue/nets/net-epoch20.nnue" }

# Generation 2, the better net, for the sets that come later.
[hosts.qapla.engines.nnue2]
binary = "new-versions/Qapla-nnue-linux-avx2"
options = { NnueFile = "test/nnue/nets2/net-epoch05.nnue" }

# --------------------------------------------------------------------------- set 1: hce vs hce
# Played and labelled by hand on the mac before this script existed, so both steps are marked
# "external" in the mac's state file: the pipeline must not start them a second time, they write
# into the same files.

[[steps]]
id = "set1-hce-play"
kind = "play"
host = "mac"
doc = "Qapla with the hand crafted eval against itself, depth 6, one game per leaf."
white = "hce"
black = "hce"
depth = 6
games = 1000020
book = "test/nnue/start-positions-1m.pgn"
output = "test/nnue/games-hce-depth6.pgn"
notation = "lan"         # started before the notation was settled; san from set 2 on

[[steps]]
id = "set1-hce-label"
kind = "label"
host = "mac"
doc = "Every position of set 1 searched to depth 8 by the hand crafted eval."
input = "test/nnue/games-hce-depth6.pgn"
engine = "hce"
depth = 8
output = "test/nnue/games-hce-depth6-labelled.pgn"
chunk_games = 10000
chunk_dir = "test/nnue/chunks"

# --------------------------------------------------------------------------- set 2: nnue1 vs nnue1
# The next thing to run. Generation 1 is the weak net, and that is the point: its mistakes take
# the games into positions a strong engine never visits, and the labels come from the hand crafted
# eval afterwards, so a weak player does not mean weak values.

[[steps]]
id = "set2-nnue1-play"
kind = "play"
host = "qapla"
doc = "Generation 1 against itself, depth 6, one game per leaf, on the linux machine."
white = "nnue1"
black = "nnue1"
depth = 6
games = 1000020
book = "test/nnue/start-positions-1m.pgn"
output = "test/nnue/games-nnue1-self-depth6.pgn"
notation = "san"

[[steps]]
id = "set2-nnue1-label"
kind = "label"
host = "qapla"
doc = "Every position of set 2 searched to depth 8 by the hand crafted eval, not by the net."
input = "test/nnue/games-nnue1-self-depth6.pgn"
engine = "hce"
depth = 8
output = "test/nnue/games-nnue1-self-labelled.pgn"
chunk_games = 10000

# --------------------------------------------------------------------------- aws spot host
# A machine that may be taken away with two minutes' notice, so it works chunk by chunk and hands
# every finished chunk to s3 at once. Its hostname changes with every launch, so it is named on
# the command line: pipeline.py run --host aws.
#
# 32 vCPU is the spot quota in us-east-1 for this account, so c7g.8xlarge is the largest that can
# be had without asking for an increase. A graviton3 core does about three quarters of what an
# apple core does here: 2,385 positions per second at concurrency 31, against 917 at 9 on the mac.

[hosts.aws]
repo = "<INSTANCE-REPO>"
qet = "~/bin/qet"
# 30 games on 32 cores: Volker's measurement. Above that the context switching of the engine
# processes costs more than the cores add, see the scaling section of generated-data.md.
concurrency = 30

[hosts.aws.engines.hce]
binary = "new-versions/Qapla-hce"

[hosts.aws.engines.nnue1]
binary = "new-versions/Qapla-nnue"
options = { NnueFile = "test/nnue/nets/net-epoch20.nnue" }

# The far end of set 1, while the mac works from 39 upward. The chunks 50..101 carry a .done marker
# on the mac so its own run skips them, and the two halves are concatenated afterwards.
[[steps]]
id = "set1-hce-label-aws"
kind = "label"
host = "aws"
# Finished on 28.09.2026; its chunks and results have been removed from s3 again.
done = true
doc = "Chunks 50 to 101 of set 1, labelled on a spot instance, each result handed to s3."
input = "test/nnue/games-hce-depth6.pgn"
engine = "hce"
depth = 8
chunk_range = [50, 101]
chunk_dir = "test/nnue/chunks"
output_dir = "test/nnue/labelled"
output_per_chunk = true
s3_chunks = "s3://<BUCKET>/set1/chunks"
s3_results = "s3://<BUCKET>/set1/labelled"

# --------------------------------------------------------------------------- set 1: to one file
# The two halves of set 1 - the mac's chunks 1 to 49 as one appended pgn, the instance's 50 to 101
# as a file per chunk - become one packed game file. Twice: once with the result of every game and
# once without it, from the identical pgn, so the two nets trained from them differ in nothing but
# that. Whether the result helps or misleads is not something we know, so we measure it.

[[steps]]
id = "set1-convert"
kind = "convert"
host = "mac"
doc = "Qapla with the hand crafted eval against itself at depth 6, labelled at depth 8."
inputs = [
  "test/nnue/games-hce-depth6-labelled.pgn",   # chunks 1..49, appended by the mac
  "test/nnue/labelled/chunk-*.pgn",            # chunks 50..101, one file each, from the instance
]
dataset_dir = "test/nnue/dataset"
output = "set1-hce-depth6"
wdl = ["result", "none"]
expect_games = 1000020

[[steps]]
id = "set1-mirror"
kind = "mirror"
host = "mac"
to = "qapla"
doc = "The dataset directory to the linux machine, so no file exists in one place only."
dataset_dir = "test/nnue/dataset"

# --------------------------------------------------------------------------- set 4: nnue1 vs hce
# The first pairing of two different engines, so every opening is played twice with the colours
# swapped: 2,000,040 games from 1,000,020 leaves. The whole set runs on one spot instance, chunk by
# chunk, and every finished chunk goes to s3 at once - a run of this length will not survive on a
# machine that can be reclaimed unless nothing of value stays only there.

[[steps]]
id = "set4-play"
kind = "play"
host = "aws"
doc = "Generation 1 against the hand crafted eval, depth 6, both colours per opening."
white = "nnue1"
black = "hce"
depth = 6
openings = 1000020
games = 2000040
chunk_openings = 10000
book = "test/nnue/start-positions-1m.pgn"
output_dir = "test/nnue/set4-played"
s3_results = "s3://<BUCKET>/set4/played"
notation = "san"

[[steps]]
id = "set4-label"
kind = "label"
host = "aws"
doc = "Every position of set 4 searched to depth 8 by the hand crafted eval, not by the net."
engine = "hce"
depth = 8
input = "unused - the chunks come from s3"
chunk_dir = "test/nnue/set4-played"
output_dir = "test/nnue/set4-labelled"
output_per_chunk = true
s3_chunks = "s3://<BUCKET>/set4/played"
s3_results = "s3://<BUCKET>/set4/labelled"

[[steps]]
id = "set4-convert"
kind = "convert"
host = "aws"
doc = "Generation 1 against the hand crafted eval at depth 6, labelled at depth 8."
inputs = ["test/nnue/set4-labelled/chunk-*.pgn"]
dataset_dir = "test/nnue/dataset"
output = "set4-nnue1-hce-depth6"
wdl = ["result", "none"]
expect_games = 2000040
s3_results = "s3://<BUCKET>/set4/dataset"
