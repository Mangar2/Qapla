kind = "train"
host = "mac"
doc = "All four sets as one corpus."
games = ["test/nnue/dataset/set1-hce-depth6-nowdl.gam",
         "test/nnue/dataset/set2-nnue1-self-depth6-nowdl.gam",
         "test/nnue/dataset/set3-nnue2-self-depth6-nowdl.gam",
         "test/nnue/dataset/set4-nnue1-hce-depth6-nowdl.gam"]
out_dir = "test/nnue/nets-set1-set2-set3-set4"
