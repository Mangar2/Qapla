# --------------------------------------------------------------------------- set 6: nnue1 vs nnue2
# A pairing of two different engines, so every opening is played twice with the colours swapped:
# 2,000,040 games from 1,000,020 leaves. The result of a game between engines of different strength
# says something about the players and not about the positions, so the packed file is written with
# the result and without it, and the training uses the variant without - set 1 measured 79 Elo
# between the two, see generated-data.md.

[[steps]]
id = "set6-play"
kind = "play"
host = "aws6"
# Taken over by the queue on 29.09.2026 after the machine was reclaimed.
done = true
doc = "nnue1 against nnue2, depth 6, both colours per opening."
white = "nnue1"
