# --------------------------------------------------------------------------- the blend experiment
# Set 1 measured 79 Elo between a net trained with the result of every game and one trained without
# it, at a blend that gives the result 20 to 30 percent of the target. An audit found no error in
# that path, so the open question is whether the damage scales with that weight - a matter of dosage -
# or whether the result competes for the capacity of a small net whatever its weight.
#
# Five percent instead of twenty to thirty answers it. The net goes into the same tournament as a
# fourth engine and catches up the rounds it is missing.

# On the mac, not on a spot instance. Training is the one step here that cannot be split into
# pieces, so a machine that is taken away costs the whole run - and it was: seven reclaims in three
# and a half hours, every restart beginning at epoch one again, and the saved nets of different
# attempts overwriting each other into a series that did not belong together. What can be split
# belongs on the spot market, what cannot does not.
[[steps]]
id = "set1-blend95-train"
kind = "train"
host = "mac"
doc = "Set 1 with the result of the game at five percent of the target instead of twenty to thirty."
games = "test/nnue/dataset/set1-hce-depth6.gam"
out_dir = "test/nnue/nets-set1-blend95"
blend_start = 0.95
blend_end = 0.95
epochs = 20
patience = 3
workers = 6
seed = 1
validation_every = 100
done = true

# --------------------------------------------------------------------------- what more games give
# Set 1 is a million games of hce against itself, set 2 a million of nnue-1 against itself. Two runs
# answer two different questions, and only together: set 2 alone says what games from a net rather
# than from the hand written evaluation are worth, and set 1 with set 2 says what twice the games are
# worth. One without the other cannot tell the two apart.
#
# Both without the result of the game, the same recipe set1-nowdl was trained with - that is the best
# known setting until the tournament of the five percent blend says otherwise, and a second variable
# would make the comparison useless.
#
# On the mac, and one after the other: they share one gpu, and two runs on it would only make both
# slower and their timings incomparable.
[[steps]]
id = "set2-train"
done = true
kind = "train"
host = "mac"
doc = "A net from set 2 alone - a million games of nnue-1 against itself."
games = "test/nnue/dataset/set2-nnue1-self-depth6-nowdl.gam"
out_dir = "test/nnue/nets-set2"
blend_start = 0.8
blend_end = 0.7
epochs = 20
patience = 3
workers = 6
seed = 1
validation_every = 100

# Two files, read as one corpus. The order they are named in is part of the run: the permutation
# that splits training from validation runs across both of them, so naming them the other way round
# holds different games back. They are read where they lie rather than copied into one file - set 2
# is trained on alone as well, and a third copy of the same games would only have to be kept in step.
[[steps]]
id = "set12-train"
done = true
kind = "train"
host = "mac"
doc = "A net from set 1 and set 2 together, two million games and a random order across both."
games = ["test/nnue/dataset/set1-hce-depth6-nowdl.gam",
         "test/nnue/dataset/set2-nnue1-self-depth6-nowdl.gam"]
out_dir = "test/nnue/nets-set1-set2"
blend_start = 0.8
blend_end = 0.7
epochs = 20
patience = 3
workers = 6
seed = 1
validation_every = 100

# Patience 2, not 3. Seven runs are on record and two of them found their best net only after an
# epoch that was worse than the one before - set 2 at epoch 9 after a setback at 5, set 1+2 at epoch 9
# - so stopping at the first setback would have thrown five epochs of the second best net in the
# tournament away. Two setbacks in a row never once came before the best net, and waiting for a third
# cost one to three epochs, 40 to 130 minutes on the large corpora.
# --------------------------------------------------------------------------- the sets, one by one
# Every net joins the gauntlet on the linux machine when its training ends, against the same hce and
# beside the ones already there - see src/pipeline/join-gauntlet.py. That is what makes the series
# readable: one figure per set, all against the same opponent in one table.
#
# The pairs of runs are the point. A set alone says what its games are worth, the same set together
# with set 1 says what they add to what was already there, and only the two together separate the
# worth of the games from the worth of their number.
#
# All of them without the result of the game, the recipe of set1-nowdl, so the games are the only
# thing that differs between them.

[[steps]]
id = "set3-train"
done = true
kind = "train"
host = "mac"
doc = "A net from set 3 alone - generation 2 against itself."
games = "test/nnue/dataset/set3-nnue2-self-depth6-nowdl.gam"
out_dir = "test/nnue/nets-set3"
blend_start = 0.8
blend_end = 0.7
epochs = 20
patience = 3
workers = 6
seed = 1
validation_every = 100

[[steps]]
id = "set123-train"
kind = "train"
host = "mac"
doc = "Set 1, 2 and 3 as one corpus - hce self play and two generations of net self play."
games = ["test/nnue/dataset/set1-hce-depth6-nowdl.gam",
         "test/nnue/dataset/set2-nnue1-self-depth6-nowdl.gam",
         "test/nnue/dataset/set3-nnue2-self-depth6-nowdl.gam"]
out_dir = "test/nnue/nets-set1-set2-set3"
blend_start = 0.8
blend_end = 0.7
epochs = 20
patience = 3
workers = 6
seed = 1
validation_every = 100

# Set 4 is the first mixed set: a net against the hand written evaluation rather than against
# itself. The expectation to be tested is that such games are worth more per position, because each
# side drives the other into positions it does not know - two engines that share an evaluation avoid
# the same things and never reach them. Set 2 against set 4 isolates that: same size, same labelling,
# same net on one side, only the pairing differs.
[[steps]]
id = "set4-train"
# Stopped by hand on 30.09.2026 after epoch 12, and not measured further. Its epoch 8
# scored 35.85 % against hce over a thousand games - the level of set1-nowdl, the
# weakest group, while set 1 to 3 together score 62.23 %. Set 4 alone was never going
# to reach that, and the hours are worth more spent on the four set corpus. What the
# mixed games are worth is a question for set1234-train, not for this run.
done = true
kind = "train"
host = "mac"
doc = "A net from set 4 alone - generation 1 against the hand written evaluation, both colours per opening."
games = "test/nnue/dataset/set4-nnue1-hce-depth6-nowdl.gam"
out_dir = "test/nnue/nets-set4"
blend_start = 0.8
blend_end = 0.7
epochs = 20
patience = 2
workers = 6
seed = 1
validation_every = 100

[[steps]]
id = "set14-train"
# Left out by decision on 30.09.2026, never run: the four set corpus comes straight
# after set 4 alone. Set 1 with set 4 would have said what the mixed games add to hce
# self play, but the three source runs already say that much, and a training costs
# hours that the larger corpus is worth more.
done = true
kind = "train"
host = "mac"
doc = "Set 1 and set 4 - the mixed games on top of hce self play."
games = ["test/nnue/dataset/set1-hce-depth6-nowdl.gam",
         "test/nnue/dataset/set4-nnue1-hce-depth6-nowdl.gam"]
out_dir = "test/nnue/nets-set1-set4"
blend_start = 0.8
blend_end = 0.7
epochs = 20
patience = 2
workers = 6
seed = 1
validation_every = 100

[[steps]]
